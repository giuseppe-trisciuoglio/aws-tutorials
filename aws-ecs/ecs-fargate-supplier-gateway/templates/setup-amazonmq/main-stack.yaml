AWSTemplateFormatVersion: "2010-09-09"
Description: "Stack to create the managed AmazonMQ RabbitMQ broker"

Parameters:
  VpcId:
    Type: AWS::EC2::VPC::Id
    Description: "VPC ID where the broker is deployed"

  PrivateSubnet1:
    Type: AWS::EC2::Subnet::Id
    Description: "First private subnet for the broker"

  PrivateSubnet2:
    Type: AWS::EC2::Subnet::Id
    Description: "Second private subnet for the broker"

  VpcCidr:
    Type: String
    Default: 10.0.0.0/16
    Description: "VPC CIDR for the security group ingress rules"
    AllowedPattern: '^(\d{1,3}\.){3}\d{1,3}/\d{1,2}$'

  BrokerInstanceType:
    Type: String
    Default: mq.t3.micro
    AllowedValues: [mq.t3.micro, mq.m5.large, mq.m5.xlarge, mq.m5.2xlarge]
    Description: "Broker instance type (mq.t3.micro for the tutorial, mq.m5.large for production)"

  BrokerEngineVersion:
    Type: String
    Default: "3.13"
    Description: "RabbitMQ engine version"

  AdminUsername:
    Type: String
    Description: "Broker administrator username (not secret: only the password is generated)"
    Default: supplieradmin
    MinLength: 4
    MaxLength: 32

  SuffissoName:
    Type: String
    Description: "Suffix for resource names"

  EnviromentTag:
    Type: String
    Default: dev
    AllowedValues: [dev, stage, prod]
    Description: "Environment tag"

  ApplicationTag:
    Type: String
    Description: "Tag to identify the application"

Resources:
  # L'articolo sceglie AmazonMQ managed al posto di un RabbitMQ containerizzato:
  # durabilita, replica e operational burden sono gestiti da AWS. Il broker sta
  # nelle stesse subnet private dei task ECS, raggiungibile via endpoint interno.

  BrokerSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: "Security group for the AmazonMQ broker (access from the private subnets)"
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - Description: "AMQP from the VPC CIDR"
          IpProtocol: tcp
          FromPort: 5671
          ToPort: 5671
          CidrIp: !Ref VpcCidr
        - Description: "Management console from the VPC CIDR"
          IpProtocol: tcp
          FromPort: 15671
          ToPort: 15671
          CidrIp: !Ref VpcCidr
      Tags:
        - Key: Name
          Value: !Sub ${SuffissoName}-${ApplicationTag}-mq-sg-${EnviromentTag}
        - Key: environment
          Value: !Ref EnviromentTag
        - Key: application
          Value: !Ref ApplicationTag

  # Secret per le credenziali admin del broker. La password viene generata
  # random (24 char, almeno un carattere per tipo), username e esplicito.
  # Il broker la recupera via dynamic reference {{resolve:secretsmanager:...}}
  # al deploy, e i task ECS la ritirano via `secrets:` key all'avvio.
  BrokerAdminSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub ${SuffissoName}/${ApplicationTag}/mq/admin
      Description: "AmazonMQ broker admin credentials for the Supplier Gateway"
      GenerateSecretString:
        SecretStringTemplate: !Sub '{"username":"${AdminUsername}"}'
        GenerateStringKey: "password"
        PasswordLength: 24
        ExcludeCharacters: '"@/\'
        RequireEachIncludedType: true
      Tags:
        - Key: environment
          Value: !Ref EnviromentTag
        - Key: application
          Value: !Ref ApplicationTag
        - Key: service
          Value: amazonmq

  Broker:
    Type: AWS::AmazonMQ::Broker
    Properties:
      BrokerName: !Sub ${SuffissoName}-${ApplicationTag}-mq-${EnviromentTag}
      DeploymentMode: SINGLE_INSTANCE
      EngineType: RABBITMQ
      EngineVersion: !Ref BrokerEngineVersion
      HostInstanceType: !Ref BrokerInstanceType
      SecurityGroups:
        - !Ref BrokerSecurityGroup
      SubnetIds:
        - !Ref PrivateSubnet1
        - !Ref PrivateSubnet2
      Users:
        - Username: !Ref AdminUsername
          # Dynamic reference: CloudFormation legge il valore del secret al
          # deploy e lo passa al broker. Il plaintext non appare mai nel
          # template né nei parameter file.
          Password: !Sub "{{resolve:secretsmanager:${BrokerAdminSecret}::password}}"
      EncryptionOptions:
        UseAwsOwnedKey: true
      PubliclyAccessible: false
      AutoMinorVersionUpgrade: true
      MaintenanceWindowStartTime:
        DayOfWeek: Sunday
        TimeOfDay: "03:00"
        TimeZone: UTC
      Tags:
        - Key: Name
          Value: !Sub ${SuffissoName}-${ApplicationTag}-mq-${EnviromentTag}
        - Key: environment
          Value: !Ref EnviromentTag
        - Key: application
          Value: !Ref ApplicationTag

Outputs:
  BrokerArn:
    Description: "AmazonMQ broker ARN"
    Value: !GetAtt Broker.Arn
    Export:
      Name: !Sub ${AWS::StackName}-BrokerArn

  BrokerId:
    Description: "AmazonMQ broker ID"
    Value: !GetAtt Broker.Id

  BrokerAmqpEndpoint:
    Description: "AMQP endpoint for RabbitMQ consumers/producers (amqps://host:port)"
    Value: !Select [ 0, !GetAtt Broker.AmqpEndpoints ]

  BrokerSecretArn:
    Description: "ARN of the Secrets Manager secret holding the broker admin username and password"
    Value: !Ref BrokerAdminSecret
    Export:
      Name: !Sub ${AWS::StackName}-BrokerSecretArn

  BrokerHost:
    Description: "Broker hostname (hostname only, no scheme or port)"
    Value: !Select [ 0, !Split [ ":", !Select [ 1, !Split [ "//", !Select [ 0, !GetAtt Broker.AmqpEndpoints ] ] ] ] ]

  BrokerAmqpPort:
    Description: "Broker AMQP port"
    Value: !Select [ 1, !Split [ ":", !Select [ 1, !Split [ "//", !Select [ 0, !GetAtt Broker.AmqpEndpoints ] ] ] ] ]

  BrokerSecurityGroupId:
    Description: "Broker security group ID"
    Value: !Ref BrokerSecurityGroup
    Export:
      Name: !Sub ${AWS::StackName}-BrokerSecurityGroupId