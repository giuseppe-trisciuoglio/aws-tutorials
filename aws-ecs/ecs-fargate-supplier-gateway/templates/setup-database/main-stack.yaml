AWSTemplateFormatVersion: "2010-09-09"
Description: "Stack to create an RDS PostgreSQL instance for the Supplier Gateway"

Parameters:
  VpcId:
    Type: AWS::EC2::VPC::Id
    Description: "VPC where the database is deployed"

  PrivateSubnet1:
    Type: AWS::EC2::Subnet::Id
    Description: "First private subnet for the DB subnet group"

  PrivateSubnet2:
    Type: AWS::EC2::Subnet::Id
    Description: "Second private subnet for the DB subnet group"

  VpcCidr:
    Type: String
    Description: "VPC CIDR for the security group ingress rules"
    AllowedPattern: '^(\d{1,3}\.){3}\d{1,3}/\d{1,2}$'

  DBName:
    Type: String
    Default: hotelsearch
    Description: "Database name (created at instance startup)"
    MinLength: 1
    MaxLength: 64
    AllowedPattern: "[a-zA-Z][a-zA-Z0-9]*"

  DBUsername:
    Type: String
    Description: "Database master username (not secret: only the password is managed)"
    MinLength: 1
    MaxLength: 16
    AllowedPattern: "[a-zA-Z][a-zA-Z0-9]*"

  DBInstanceClass:
    Type: String
    Default: db.t4g.micro
    AllowedValues:
      - db.t4g.micro
      - db.t4g.small
      - db.t3.small
      - db.t3.medium
      - db.r6g.large
    Description: "RDS instance class"

  DBEngineVersion:
    Type: String
    Default: "17.2"
    Description: "PostgreSQL version (the gateway uses postgres:17)"

  DBAllocatedStorage:
    Type: Number
    Default: 20
    Description: "Initially allocated storage (GB)"

  DBMaxAllocatedStorage:
    Type: Number
    Default: 100
    Description: "Maximum storage with autoscaling (GB)"

  MultiAZ:
    Type: String
    Default: "false"
    AllowedValues: ["true", "false"]
    Description: "Multi-AZ for high availability (true = production, false = tutorial)"

  SuffissoName:
    Type: String
    Description: "Suffix for resource names"

  EnviromentTag:
    Type: String
    Default: dev
    AllowedValues: [dev, stage, prod]
    Description: "Environment tag"

  ApplicationTag:
    Type: String
    Description: "Tag to identify the application"

Resources:
  # Parameter group: richiede SSL per le connessioni. Il driver JDBC del
  # gateway supporta SSL, quindi forzarlo e una buona default per il tutorial.
  PostgresDBParameterGroup:
    Type: AWS::RDS::DBParameterGroup
    Properties:
      Description: "Parameter group for PostgreSQL with SSL enforced"
      Family: postgres17
      Parameters:
        rds.force_ssl: "1"
        log_min_duration_statement: "1000"
      Tags:
        - Key: Name
          Value: !Sub ${SuffissoName}-${ApplicationTag}-pg-params-${EnviromentTag}
        - Key: environment
          Value: !Ref EnviromentTag
        - Key: application
          Value: !Ref ApplicationTag

  # Subnet group: il DB sta nelle due subnet private su AZ diverse.
  # Richiesto da RDS perche ogni istanza sia in una sola AZ ma il subnet
  # group copra piu AZ per failover (se MultiAZ=true).
  DBSubnetGroup:
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      DBSubnetGroupName: !Sub ${SuffissoName}-${ApplicationTag}-subnet-group-${EnviromentTag}
      DBSubnetGroupDescription: "DB subnet group for the Supplier Gateway RDS PostgreSQL"
      SubnetIds:
        - !Ref PrivateSubnet1
        - !Ref PrivateSubnet2
      Tags:
        - Key: Name
          Value: !Sub ${SuffissoName}-${ApplicationTag}-subnet-group-${EnviromentTag}
        - Key: environment
          Value: !Ref EnviromentTag
        - Key: application
          Value: !Ref ApplicationTag

  # Security group: apre 5432 dal CIDR della VPC. Per i task ECS il traffico
  # viene da una subnet privata, quindi incluso nel CIDR. In produzione
  # stringere a SourceSecurityGroupId del task SG per least privilege.
  PostgresDBSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: "Allows PostgreSQL access from the VPC CIDR"
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 5432
          ToPort: 5432
          CidrIp: !Ref VpcCidr
          Description: "PostgreSQL from the VPC CIDR"
      Tags:
        - Key: Name
          Value: !Sub ${SuffissoName}-${ApplicationTag}-postgres-sg-${EnviromentTag}
        - Key: environment
          Value: !Ref EnviromentTag
        - Key: application
          Value: !Ref ApplicationTag

  # RDS PostgreSQL instance. Single-AZ per il tutorial; passare MultiAZ=true
  # per produzione. DeletionPolicy Retain protegge i dati da delete accidentali.
  PostgresDBInstance:
    Type: AWS::RDS::DBInstance
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      DBInstanceIdentifier: !Sub ${SuffissoName}-${ApplicationTag}-postgres-${EnviromentTag}
      DBParameterGroupName: !Ref PostgresDBParameterGroup
      DBName: !Ref DBName
      Engine: postgres
      EngineVersion: !Ref DBEngineVersion
      MasterUsername: !Ref DBUsername
      # ManageMasterUserPassword: RDS genera una password random, la salva in
      # Secrets Manager e ne mantiene la rotazione automatica. Il segreto
      # ARN e recuperabile via !GetAtt PostgresDBInstance.MasterUserSecret.
      ManageMasterUserPassword: true
      DBInstanceClass: !Ref DBInstanceClass
      AllocatedStorage: !Ref DBAllocatedStorage
      MaxAllocatedStorage: !Ref DBMaxAllocatedStorage
      StorageType: gp3
      PubliclyAccessible: false
      MultiAZ: !Ref MultiAZ
      VPCSecurityGroups:
        - !Ref PostgresDBSecurityGroup
      DBSubnetGroupName: !Ref DBSubnetGroup
      BackupRetentionPeriod: 7
      DeletionProtection: true
      EnableCloudwatchLogsExports:
        - postgresql
      Tags:
        - Key: Name
          Value: !Sub ${SuffissoName}-${ApplicationTag}-postgres-${EnviromentTag}
        - Key: environment
          Value: !Ref EnviromentTag
        - Key: application
          Value: !Ref ApplicationTag

Outputs:
  DBEndpoint:
    Description: "Database connection endpoint (hostname)"
    Value: !GetAtt PostgresDBInstance.Endpoint.Address
    Export:
      Name: !Sub ${AWS::StackName}-DBEndpoint

  DBPort:
    Description: "Database connection port"
    Value: !GetAtt PostgresDBInstance.Endpoint.Port
    Export:
      Name: !Sub ${AWS::StackName}-DBPort

  DBName:
    Description: "Database name"
    Value: !Ref DBName
    Export:
      Name: !Sub ${AWS::StackName}-DBName

  DBUsername:
    Description: "Database master username (username only, password in Secrets Manager)"
    Value: !Ref DBUsername
    Export:
      Name: !Sub ${AWS::StackName}-DBUsername

  DBSecretArn:
    Description: "ARN of the Secrets Manager secret holding the DB master username and password"
    Value: !GetAtt PostgresDBInstance.MasterUserSecret.SecretArn
    Export:
      Name: !Sub ${AWS::StackName}-DBSecretArn

  DBInstanceIdentifier:
    Description: "RDS instance identifier"
    Value: !Ref PostgresDBInstance
    Export:
      Name: !Sub ${AWS::StackName}-DBInstanceIdentifier

  DBSecurityGroupId:
    Description: "Database security group ID"
    Value: !Ref PostgresDBSecurityGroup
    Export:
      Name: !Sub ${AWS::StackName}-DBSecurityGroupId